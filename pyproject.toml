[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attest"
version = "0.1.0"
description = "Budgeted re-verification scheduling for AI agent identity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "zero-trust",
    "agent-identity",
    "continuous-authentication",
    "trust-management",
    "non-human-identity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Cryptographic verification of real SAMACP envelopes.
samacp = [
    "pynacl>=1.5",
    "pyjwt>=2.8",
    "cryptography>=41",
    "pyld>=2.0",
    "requests>=2.31",
]
# The HTTP service the console talks to.
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "attest[samacp]",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "attest[samacp,service]",
]

[project.scripts]
attest = "attest.cli:main"

[tool.setuptools.packages.find]
include = ["attest*", "service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
